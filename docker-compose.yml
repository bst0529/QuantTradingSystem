version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: src/QuantTrading.Api/Dockerfile
    ports:
      - "5050:8080"
    volumes:
      - sqldata:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quant_data.db
      - TZ=Asia/Taipei # 加入時區確保量化系統時間正確

  worker:
    build:
      context: .
      dockerfile: src/QuantTrading.Worker/Dockerfile
    volumes:
      - sqldata:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quant_data.db
      - TZ=Asia/Taipei
    depends_on:
      - api

volumes:
  sqldata: # 建立一個名為 sqldata 的共用磁碟