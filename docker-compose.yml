version: '3.8'

services:
  api:
    build:
      context: ./src
      dockerfile: QuantTrading.Api/Dockerfile
    ports:
      - "5050:5050"
    volumes:
      - sqldata:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quant_data.db

  worker:
    build:
      context: ./src
      dockerfile: QuantTrading.Worker/Dockerfile
    volumes:
      - sqldata:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/quant_data.db
    depends_on:
      - api

volumes:
  sqldata: # 建立一個名為 sqldata 的共用磁碟